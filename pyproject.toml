[project]
name = "math-job-operator"
version = "0.1.0"
description = "Capital.com Data & Instruments Mathematics API Microservice — runs Python data-processing jobs against market instrument data on demand."
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymongo>=4.10",
    "redis>=5.2",
    "requests>=2.32",
    "python-multipart>=0.0.12",
    "to_session_manager",
    "to_collector_client",
]

[project.scripts]
math-job-operator = "math_job_operator.server:main"

[tool.uv.sources]
to_session_manager = { git = "ssh://git@github.com/diaconovi/Trade_Ops_Library.git", subdirectory = "packages/to_session_manager" }
to_collector_client = { git = "ssh://git@github.com/diaconovi/Trade_Ops_Library.git", subdirectory = "packages/to_collector" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_job_operator"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
